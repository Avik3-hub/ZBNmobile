name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Restore stable Android signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Repository secret ANDROID_DEBUG_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Test and build ARM64 Release APK
        env:
          ZBN_VERSION_CODE: ${{ github.run_number }}
        run: gradle clean testReleaseUnitTest assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          signer_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$signer_path" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Give APK a unique name
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/ZBNmobile-1.4.9-build-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZBNmobile-1.4.9-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/ZBNmobile-1.4.9-build-${{ github.run_number }}.apk
          retention-days: 7
